name: Monthly export data update

on:
  schedule:
    # 04:30 UTC is 10:00 IST. Runs every day from the 14th to the 28th; once the new month is in,
    # the remaining runs that month find nothing new and finish in seconds.
    - cron: "30 4 14-28 * *"
  workflow_dispatch:
    # Leave every box empty to look for new months now.
    inputs:
      verify:
        description: "Re-check stored figures against their official PDFs: a month (YYYY-MM) or all. Changes nothing."
        required: false
        default: ""
      month:
        description: "Add Ministry highlights: the month (YYYY-MM)"
        required: false
        default: ""
      drivers:
        description: "Add Ministry highlights: the list that follows 'Major drivers of merchandise exports growth in <month> include'"
        required: false
        default: ""
      release:
        description: "Add Ministry highlights: link to that month's press release on pib.gov.in (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Check the stored data
        run: python tools/update_month.py --check

      - name: Update the data
        env:
          VERIFY_MONTH: ${{ github.event.inputs.verify }}
          ANNOTATE_MONTH: ${{ github.event.inputs.month }}
          ANNOTATE_DRIVERS: ${{ github.event.inputs.drivers }}
          ANNOTATE_RELEASE: ${{ github.event.inputs.release }}
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit_message.txt
        run: python tools/auto_update.py

      - name: Commit and push
        env:
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit_message.txt
        run: |
          if git diff --quiet -- data.json; then
            echo "No new data to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "$(cat "$COMMIT_MSG_FILE")"
          git push
