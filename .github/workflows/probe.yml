name: Probe official sources (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe
        run: |
          python - <<'PY'
          import io, re, sys, traceback
          sys.path.insert(0, "tools")
          import auto_update as au
          import update_month as um
          import pdfplumber

          def title_of(t):
              m = re.search(r"(?is)<title[^>]*>(.*?)</title>", t)
              return re.sub(r"\s+", " ", m.group(1)).strip()[:100] if m else None

          def show(label, url):
              print(f"\n### {label}\nGET {url}")
              try:
                  r = au.S.get(url, timeout=60)
              except Exception as e:
                  print(f"ERROR: {type(e).__name__}: {e}")
                  return None
              ct = r.headers.get("content-type", "")
              print(f"HTTP {r.status_code}, {len(r.content)} bytes, type {ct}, server {r.headers.get('server')}, final {r.url}")
              if r.history:
                  print("redirects:", [h.status_code for h in r.history])
              if "html" in ct or "xml" in ct or "text" in ct:
                  t = r.text
                  anchors = len(re.findall(r"(?i)<a\s", t))
                  body = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t)).strip()
                  print(f"title {title_of(t)!r}, anchors {anchors}, viewstate {'__VIEWSTATE' in t}")
                  print("text:", body[:400])
              return r

          def pdf_text(raw):
              with pdfplumber.open(io.BytesIO(raw)) as pdf:
                  return "\n".join(p.extract_text() or "" for p in pdf.pages)

          def around(txt, pat, n=420):
              m = re.search(pat, txt, re.I)
              return txt[max(0, m.start() - 60): m.start() + n] if m else None

          show("PIB list", "https://www.pib.gov.in/allRel.aspx?reg=3&lang=1")
          show("PIB list without www", "https://pib.gov.in/allRel.aspx?reg=3&lang=1")
          show("PIB release, August 2026", "https://www.pib.gov.in/PressReleasePage.aspx?PRID=2310636")
          show("PIB RSS", "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3")
          show("PIB static PDF", "https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/sep/doc_9876_20260915_19512001.pdf")
          print("\n### PIB lookup as the updater does it")
          try:
              print(au.find_pib_release("2026-08"))
          except Exception:
              traceback.print_exc()

          r = show("Commerce API", "https://www.commerce.gov.in/ministryofcommerce/api/v1/press-release-pib")
          if r is not None and r.ok:
              try:
                  items = r.json()
                  rel = [d for d in items if d.get("field_select_press_release_1") == "530"]
                  print(f"{len(items)} items, {len(rel)} data-related")
                  for d in rel[:6]:
                      print(" ", d.get("field_dates"), "|", d.get("title"), "|", d.get("field_upload_file"))
              except Exception:
                  traceback.print_exc()
          base = "https://www.commerce.gov.in/files/d-m-y/"
          r = show("Commerce press release PDF, August 2026", base + "PIB%20Release%20-%20August%202026.pdf")
          if r is not None and r.content[:4] == b"%PDF":
              t = re.sub(r"\s+", " ", pdf_text(r.content))
              print("start:", t[:600])
              print("headline:", around(t, r"Merchandise exports (during|in|for) August"))
              print("drivers:", around(t, r"Major drivers of merchandise"))
          r = show("Commerce quick estimates PDF, August 2026", base + "Quick%20Estimates%20August%202026.pdf")
          if r is not None and r.content[:4] == b"%PDF":
              try:
                  print("parse_quick GRAND TOTAL:", um.parse_quick(r.content, "2026-08")["GRAND TOTAL"])
              except SystemExit as e:
                  print("parse_quick failed:", e)
          show("DGCI&S list", "https://www.dgciskol.gov.in/Quick_Estimate.aspx")
          PY
